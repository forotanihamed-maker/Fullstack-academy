<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sportify — Premium Sports Equipment</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="header-navbar" aria-label="Main navigation">
        <div class="nav-left">
          <a href="#" class="brandName">Sportify</a>
        </div>
        <div class="nav-right">
          <a href="#products" class="nav-link">Products</a>
          <a href="#about" class="nav-link">About</a>
          <a href="#contact" class="nav-link">Contact</a>
          <button type="button" class="nav-link cart-btn" id="cart-btn">
            Cart (<span id="cart-count">0</span>)
          </button>
        </div>
      </nav>
    </header>
    <div class="overlay" id="overlay">
      <section
        class="sabad"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cart-title"
      >
        <header class="sabad-header">
          <h2 id="cart-title">Your Cart</h2>
          <button
            type="button"
            class="sabad-close"
            id="cart-close"
            aria-label="Close cart"
          >
            ×
          </button>
        </header>

        <div class="sabad-items" id="sabad-items"></div>

        <footer class="sabad-footer" id="sabad-footer">
          <p class="sabad-total" id="sabad-total"></p>
          <button type="button" class="btn-clear" id="clear-cart">
            Clear Cart
          </button>
        </footer>
      </section>
    </div>
    <div class="overlay" id="details-overlay">
      <section
        class="details-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="details-name"
      >
        <header>
          <button type="button" id="details-close" aria-label="Close details">
            ×
          </button>
        </header>
        <img id="details-img" src="" alt="" width="600" height="400" />
        <h3 id="details-name"></h3>
        <p id="details-desc"></p>
        <p id="details-category"></p>
        <p id="details-price"></p>
        <button type="button" id="details-add">Add to Cart</button>
      </section>
    </div>

    <main>
      <section class="hero" id="hero">
        <div class="hero-text">
          <h1 class="hero-title">
            Train Hard.<br />
            <span>Play Better.</span>
          </h1>
          <p class="hero-subtitle">
            Premium sports equipment for athletes who refuse to settle for
            average.
          </p>
          <a href="#products" class="hero-btn">Shop Now</a>
        </div>
        <div class="hero-img-wrap">
          <img
            src="./images/hero.jpg"
            alt="Athlete training with premium sports gear"
            class="hero-img"
          />
        </div>
      </section>
      <section class="products" id="products">
        <h2 class="section-title">Our Products</h2>

        <div class="products-toolbar">
          <label for="search-input" class="sr-only">Search products</label>
          <input
            type="search"
            id="search-input"
            placeholder="Search products..."
          />
          <div class="filter-buttons" id="filter-buttons">
            <label for="filter" class="sr-only">Filter by category</label>
            <select name="category" id="filter">
              <option value="all">All categories</option>
              <option value="shoes">Shoes</option>
              <option value="equipment">Equipment</option>
              <option value="accessories">Accessories</option>
            </select>
          </div>
        </div>

        <div class="products-grid" id="products-grid">
          <!-- کارت‌ها اینجا با JS تزریق میشن -->
        </div>

        <p class="no-results" id="no-results" role="status" hidden>
          No products found.
        </p>
      </section>
    </main>

    <footer class="footer">
      <p id="about">Sportify — premium sports equipment for every athlete.</p>
      <p id="contact">Contact: <a href="mailto:hello@sportify.example">hello@sportify.example</a></p>
    </footer>
    <p class="sr-only" id="cart-status" role="status"></p>

    <script src="./index.js"></script>
  </body>
</html>
